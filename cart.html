<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cart — Francesca de Luis</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand"><div class="logo">FD</div><div><div style="font-weight:700">Francesca De Luis Store</div></div></div>
    </header>

    <section class="section">
      <h2>Your Cart</h2>
      <div id="cart-content">
        <div id="cart-items"></div>
        <div id="cart-summary" style="margin-top:18px">
          <div>Total: <strong id="cart-total">$0.00</strong></div>
          <div style="margin-top:12px">
            <button id="cart-checkout" class="btn btn-primary">Proceed to Checkout</button>
            <button id="cart-clear" class="btn">Clear Cart</button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="js/products.js"></script>
  <script src="js/cart-page.js"></script>
  <script src="js/account.js"></script>
</body>
</html>
